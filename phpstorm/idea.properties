# File Size Limits (KB) for large monorepos
idea.max.intellisense.filesize=10000
idea.max.content.load.filesize=50000
idea.max.vcs.loaded.size.kb=102400
idea.filewatcher.max.file.size=5000
# Console buffer (KB)
idea.cycle.buffer.size=10240
# Indexing parallelism: left unset on purpose. The IDE already uses
# (logical CPUs - 1) threads; a physical-cores value would lower that on
# SMT/hyper-threaded CPUs. Set only to cap indexing below the default.
#caches.indexerThreadsCount=
# Index/cache/log locations
idea.system.path=${user.home}/.PhpStorm/system
idea.log.path=${user.home}/.PhpStorm/log
# UI / windowing
ide.ui.new.file.chooser=true
ide.tree.horizontal.default.autoscrolling=false
ide.win.frame.decoration=true
